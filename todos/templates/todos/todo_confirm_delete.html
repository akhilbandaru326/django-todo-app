{% extends 'todos/base.html' %}

{% block title %}Delete Todo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger border-0 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete</h5>
            </div>
            <div class="card-body text-center py-4">
                <p class="fs-5">Are you sure you want to delete:</p>
                <p class="fw-bold fs-4 text-danger">"{{ todo.title }}"</p>
                <div class="d-flex justify-content-center gap-3 mt-3">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Yes, Delete
                        </button>
                    </form>
                    <a href="{% url 'todo_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
